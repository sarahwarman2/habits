<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Habit Grid</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#23262b; --muted:#6b7078; --line:#e3e0d8; --accent:#3b5b7a; --warn:#8a6d3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191c; --card:#202327; --ink:#eceae4; --muted:#9aa0a8; --line:#33373c; --accent:#8fb3d6; --warn:#d4b27a; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  main{max-width:560px;margin:0 auto;padding:16px 0 48px}
  .pad{padding:0 14px}
  h1{font-size:22px;margin:0 0 2px}
  h2{font-size:17px;margin:22px 0 6px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 12px}
  .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .tbl{display:grid;align-items:center;width:max-content}
  .nm{position:sticky;left:0;z-index:2;background:var(--bg);padding:4px 8px 4px 14px;min-height:46px;display:flex;flex-direction:column;justify-content:center;border-left:6px solid transparent}
  .nm .t{font-weight:600;font-size:15px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .nm .ct{color:var(--muted);font-size:12px;margin-top:2px}
  .hd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:58px;font-size:12px;color:var(--muted);padding-bottom:4px}
  .hd .mo{height:14px;font-weight:600;color:var(--ink)}
  .hd .dn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink)}
  .hd.today .dn{background:var(--accent);color:#fff;font-weight:600}
  .c{width:34px;height:34px;margin:6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:transparent;font-size:17px;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .c.on{font-weight:700}
  .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}
  .link{background:none;border:0;color:var(--accent);font-size:15px;padding:8px;text-decoration:underline}
  #status{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .edit-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
  input[type=text],textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;padding:0 10px;font-family:inherit}
  input[type=text]{min-height:44px}
  textarea{padding:8px 10px;min-height:90px;font-size:14px}
  .small{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
  .small.del{color:var(--warn)}
  .swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
  .add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
  .btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:16px}
  .btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <div class="pad">
    <h1>Habit grid</h1>
    <p class="hint">Tap a day to mark it done. Tap again to clear. Swipe sideways for earlier days.</p>
  </div>

  <section id="gridView">
    <div class="wrap" id="wrap"><div class="tbl" id="tbl"></div></div>
  </section>

  <section id="editView" class="pad" hidden>
    <ul id="editList"></ul>
    <div class="add">
      <input type="text" id="newName" placeholder="Add a habit" maxlength="60">
      <button class="btn" id="addBtn">Add</button>
    </div>

    <h2>Back up and restore</h2>
    <p class="hint">Your habits live only on this phone. Back up now and then, and before deleting the app.</p>
    <div class="row2">
      <button class="btn" id="backupBtn">Back up</button>
      <button class="btn alt" id="fileBtn">Restore from file</button>
      <input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>
    </div>
    <p class="hint" style="margin-top:12px">Or paste a backup here:</p>
    <textarea id="box" placeholder="Backup text appears here, or paste one to restore"></textarea>
    <div class="row2"><button class="btn alt" id="restoreBtn">Restore from pasted text</button></div>
  </section>

  <div class="pad">
    <div class="foot">
      <button class="link" id="editToggle">Edit habits</button>
      <span>
        <button class="link" id="expThis">Export this month</button>
        <button class="link" id="expLast">Last month</button>
      </span>
    </div>
    <p id="status"></p>
  </div>
</main>

<script>
(function(){
  var KEY = "habit-grid-v1";
  var DEFAULTS = ["No-spend day","Read from a physical book","Made art","Cooked a full meal"];
  var PALETTE = ["#e69f00","#56b4e9","#009e73","#d55e00","#cc79a7","#0072b2","#f0e442","#8e6bbf","#7a9a3a","#e15759"];
  var NDAYS = 120;
  var items = [], days = {}, editing = false, pendingDelete = null, pendingRestore = false, didScroll = false, renderedDay = "";

  var $ = function(id){ return document.getElementById(id); };
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function key(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function todayDate(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function newId(){ return "i" + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36); }
  function setStatus(t){ $("status").textContent = t; }
  function textOn(hex){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#1a1a1a" : "#ffffff";
  }
  function pickColor(){
    var used = items.map(function(i){ return i.color; });
    for (var i = 0; i < PALETTE.length; i++) if (used.indexOf(PALETTE[i]) < 0) return PALETTE[i];
    return PALETTE[items.length % PALETTE.length];
  }
  function monthCount(itemId, y, m){
    var c = 0, last = new Date(y, m+1, 0).getDate();
    for (var d = 1; d <= last; d++){
      var v = days[y + "-" + pad(m+1) + "-" + pad(d)];
      if (v && v[itemId] === 1) c++;
    }
    return c;
  }

  /* ---------- storage: this phone only ---------- */
  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify({items: items, days: days}));
      setStatus("Saved on this phone");
    } catch(e){
      setStatus("Couldn't save. Storage may be full or blocked.");
    }
  }
  function load(){
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && Array.isArray(o.items) && o.days && typeof o.days === "object"){ items = o.items; days = o.days; return true; }
    } catch(e){}
    return false;
  }
  function init(){
    if (!load()){
      items = DEFAULTS.map(function(n, i){ return {id:newId(), name:n, color:PALETTE[i]}; });
      days = {};
      save();
    } else {
      var changed = false;
      items.forEach(function(it){ if (!it.color){ it.color = pickColor(); changed = true; } });
      if (changed) save();
      setStatus("Saved on this phone");
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  }

  /* ---------- grid ---------- */
  function paintCell(btn, it, on){
    if (on){
      btn.className = "c on";
      btn.style.background = it.color; btn.style.borderColor = it.color; btn.style.color = textOn(it.color);
      btn.textContent = "✓";
    } else {
      btn.className = "c";
      btn.style.background = ""; btn.style.borderColor = ""; btn.style.color = "";
      btn.textContent = "";
    }
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  function updateCount(itemId){
    var el = document.querySelector('[data-ct="' + itemId + '"]');
    if (!el) return;
    var t = todayDate(), c = monthCount(itemId, t.getFullYear(), t.getMonth());
    el.textContent = t.toLocaleDateString(undefined,{month:"short"}) + ": " + c;
  }
  function renderGrid(){
    var wrap = $("wrap"), tbl = $("tbl");
    var keep = wrap.scrollLeft;
    tbl.textContent = "";
    var today = todayDate();
    renderedDay = key(today);
    tbl.style.gridTemplateColumns = "120px repeat(" + NDAYS + ", 46px)";
    var dates = [];
    for (var i = NDAYS - 1; i >= 0; i--) dates.push(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i));

    var corner = document.createElement("div"); corner.className = "nm"; corner.style.height = "58px"; tbl.appendChild(corner);
    dates.forEach(function(d, idx){
      var h = document.createElement("div"); h.className = "hd" + (key(d) === key(today) ? " today" : "");
      var mo = document.createElement("span"); mo.className = "mo";
      if (d.getDate() === 1 || idx === 0) mo.textContent = d.toLocaleDateString(undefined,{month:"short"});
      var wd = document.createElement("span"); wd.textContent = d.toLocaleDateString(undefined,{weekday:"narrow"});
      var dn = document.createElement("span"); dn.className = "dn"; dn.textContent = d.getDate();
      h.appendChild(mo); h.appendChild(wd); h.appendChild(dn); tbl.appendChild(h);
    });

    items.forEach(function(it){
      var nm = document.createElement("div"); nm.className = "nm"; nm.style.borderLeftColor = it.color;
      var t = document.createElement("span"); t.className = "t"; t.textContent = it.name;
      var ct = document.createElement("span"); ct.className = "ct"; ct.setAttribute("data-ct", it.id);
      nm.appendChild(t); nm.appendChild(ct); tbl.appendChild(nm);
      dates.forEach(function(d){
        var dk = key(d), v = days[dk] || {};
        var b = document.createElement("button");
        b.setAttribute("data-i", it.id); b.setAttribute("data-d", dk);
        b.setAttribute("aria-label", it.name + ", " + d.toLocaleDateString(undefined,{month:"long",day:"numeric"}));
        paintCell(b, it, v[it.id] === 1);
        tbl.appendChild(b);
      });
      updateCount(it.id);
    });
    if (!didScroll && items.length){ wrap.scrollLeft = wrap.scrollWidth; didScroll = true; }
    else wrap.scrollLeft = keep;
  }
  $("tbl").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".c") : null;
    if (!b) return;
    var itemId = b.getAttribute("data-i"), dk = b.getAttribute("data-d");
    var it = items.filter(function(x){ return x.id === itemId; })[0];
    if (!it) return;
    var v = days[dk] = days[dk] || {};
    if (v[itemId] === 1) delete v[itemId]; else v[itemId] = 1;
    if (!Object.keys(v).length) delete days[dk];
    paintCell(b, it, v[itemId] === 1);
    updateCount(itemId);
    save();
  });

  /* ---------- edit view ---------- */
  function renderEdit(){
    var ul = $("editList"); ul.textContent = "";
    items.forEach(function(it, i){
      var li = document.createElement("li"); li.className = "edit-row";
      var sw = document.createElement("button"); sw.className = "swatch"; sw.style.background = it.color;
      sw.setAttribute("aria-label","Change color");
      sw.addEventListener("click", function(){
        var k = PALETTE.indexOf(it.color); it.color = PALETTE[(k + 1) % PALETTE.length]; save(); render();
      });
      li.appendChild(sw);
      var inp = document.createElement("input"); inp.type = "text"; inp.value = it.name; inp.maxLength = 60;
      inp.addEventListener("change", function(){
        var n = inp.value.trim(); if (!n){ inp.value = it.name; return; }
        it.name = n; save(); render();
      });
      li.appendChild(inp);
      [["↑",-1],["↓",1]].forEach(function(p){
        var b = document.createElement("button"); b.className = "small"; b.textContent = p[0];
        b.addEventListener("click", function(){
          var j = i + p[1]; if (j < 0 || j >= items.length) return;
          var t = items[i]; items[i] = items[j]; items[j] = t; save(); render();
        });
        li.appendChild(b);
      });
      var del = document.createElement("button"); del.className = "small del";
      del.textContent = pendingDelete === it.id ? "Sure?" : "✕";
      del.addEventListener("click", function(){
        if (pendingDelete === it.id){ items.splice(i,1); pendingDelete = null; save(); }
        else pendingDelete = it.id;
        render();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
    $("restoreBtn").textContent = pendingRestore ? "Replace everything? Tap again" : "Restore from pasted text";
  }
  function render(){
    $("gridView").hidden = editing;
    $("editView").hidden = !editing;
    $("editToggle").textContent = editing ? "Done editing" : "Edit habits";
    if (editing) renderEdit(); else renderGrid();
  }

  /* ---------- share / export / backup ---------- */
  function showText(text, msg){
    $("box").value = text;
    if (!editing){ editing = true; render(); }
    $("box").focus(); try { $("box").select(); } catch(e){}
    setStatus(msg);
  }
  function fallbackCopy(text, name){
    var msg = "Select all the text in the box and copy it.";
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ setStatus("Copied " + name + " to the clipboard. Paste it into Notes or Files."); },
        function(){ showText(text, msg); });
    } else showText(text, msg);
  }
  function shareFile(name, text, mime){
    try {
      var f = new File([text], name, {type: mime});
      if (navigator.canShare && navigator.canShare({files: [f]})){
        navigator.share({files: [f], title: name})
          .then(function(){ setStatus("Shared " + name); })
          .catch(function(e){ if (!e || e.name !== "AbortError") fallbackCopy(text, name); });
        return;
      }
    } catch(e){}
    fallbackCopy(text, name);
  }
  function csvCell(s){ s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
  function monthCsv(base){
    var y = base.getFullYear(), m = base.getMonth(), last = new Date(y, m+1, 0).getDate();
    var rows = [["Date"].concat(items.map(function(it){ return it.name; }))];
    for (var d = 1; d <= last; d++){
      var dk = y + "-" + pad(m+1) + "-" + pad(d), v = days[dk] || {};
      rows.push([dk].concat(items.map(function(it){ return v[it.id] === 1 ? "Did it" : ""; })));
    }
    rows.push(["Days done"].concat(items.map(function(it){ return monthCount(it.id, y, m); })));
    return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n");
  }
  function doExport(base){
    shareFile("habits-" + base.getFullYear() + "-" + pad(base.getMonth()+1) + ".csv", monthCsv(base), "text/csv");
  }
  $("expThis").addEventListener("click", function(){ var t = todayDate(); doExport(new Date(t.getFullYear(), t.getMonth(), 1)); });
  $("expLast").addEventListener("click", function(){ var t = todayDate(); doExport(new Date(t.getFullYear(), t.getMonth()-1, 1)); });

  $("backupBtn").addEventListener("click", function(){
    var text = JSON.stringify({app: "habit-grid", version: 1, saved: key(todayDate()), items: items, days: days});
    shareFile("habit-grid-backup-" + key(todayDate()) + ".json", text, "application/json");
  });
  function tryRestore(text){
    var o;
    try { o = JSON.parse(text); } catch(e){ setStatus("That doesn't look like a backup."); return false; }
    if (!o || !Array.isArray(o.items) || !o.days || typeof o.days !== "object"){ setStatus("That doesn't look like a backup."); return false; }
    items = o.items.filter(function(it){ return it && it.id && it.name; });
    items.forEach(function(it){ if (!it.color) it.color = pickColor(); });
    days = o.days;
    save(); didScroll = false; pendingRestore = false; render();
    setStatus("Restored " + items.length + " habits.");
    return true;
  }
  $("restoreBtn").addEventListener("click", function(){
    var text = $("box").value.trim();
    if (!text){ setStatus("Paste a backup into the box first."); return; }
    if (!pendingRestore){ pendingRestore = true; render(); return; }
    tryRestore(text);
  });
  $("fileBtn").addEventListener("click", function(){ $("fileIn").click(); });
  $("fileIn").addEventListener("change", function(){
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){ $("box").value = String(r.result || ""); pendingRestore = true; render(); setStatus("Backup loaded. Tap the Restore button again to replace everything."); };
    r.readAsText(f);
    this.value = "";
  });

  /* ---------- wiring ---------- */
  $("editToggle").addEventListener("click", function(){ editing = !editing; pendingDelete = null; pendingRestore = false; render(); });
  function addItem(){
    var inp = $("newName"), n = inp.value.trim(); if (!n) return;
    items.push({id:newId(), name:n, color:pickColor()}); inp.value = ""; save(); render();
  }
  $("addBtn").addEventListener("click", addItem);
  $("newName").addEventListener("keydown", function(e){ if (e.key === "Enter") addItem(); });
  // a new day started while the app was in the background
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && !editing && renderedDay !== key(todayDate())){ didScroll = false; render(); }
  });

  init();
  render();

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
